<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d2fe0">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light">
<title>NurBuy Rider</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Tiro+Bangla&display=swap" rel="stylesheet">
<style>
:root{
  --pri:#1d2fe0;--pri2:#2a5fd6;--acc:#ff6a00;--tx:#151a2d;--mu:#6b7390;--bg:#f1f4fa;--bd:#e3e7f2;--card:#fff;
  --ok:#12a150;--okbg:#e4f6ec;--bad:#d92d3a;--badbg:#fdeaec;--warn:#b45309;--warnbg:#fff1e3;--infobg:#e8edff;
  --sh:0 4px 16px rgba(20,30,90,.08);--r:16px;
  --fb:'Hind Siliguri',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--fh:'Tiro Bangla','Hind Siliguri',serif;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#e6ebf5;color:var(--tx);font:400 15px/1.45 var(--fb);min-height:100vh}
html[lang=bn] body *{font-weight:400!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:disabled{cursor:not-allowed}
a{color:var(--pri2)}
h1,h2,h3,p{margin:0}
[hidden]{display:none!important}
:focus-visible{outline:3px solid rgba(42,95,214,.45);outline-offset:2px}
#app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;box-shadow:0 0 40px rgba(20,30,90,.12);padding-bottom:calc(76px + var(--sab))}
#app.notabs{padding-bottom:calc(24px + var(--sab))}
#app.hasbar{padding-bottom:calc(150px + var(--sab))}
.h{font-family:var(--fh);font-weight:400}
html[lang=en] .h{font-family:var(--fb);font-weight:700}
html[lang=en] .b6{font-weight:600}
html[lang=en] .b7{font-weight:700}
/* top bars */
.bar{display:flex;align-items:center;gap:8px;padding:calc(10px + var(--sat)) 14px 10px;background:#fff;border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:20;min-height:56px}
.bar h1{font-size:19px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{width:44px;height:44px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;color:var(--tx);flex:none}
.ib:active{background:var(--bg)}
.ib svg{width:22px;height:22px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.pg{padding:14px 14px 8px}
.gap{display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:14px;border:1px solid transparent}
.card h2{font-size:16px;margin-bottom:8px}
.mu{color:var(--mu)}
.sm{font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1;min-width:0}
.tc{text-align:center}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;padding:10px 18px;border-radius:14px;background:var(--pri);color:#fff;font-size:16px;text-align:center;position:relative;transition:transform .08s,opacity .15s}
.btn:active{transform:scale(.985)}
.btn.sec{background:#fff;color:var(--pri);border:1.5px solid var(--pri)}
.btn.gh{background:transparent;color:var(--pri2)}
.btn.dng{background:#fff;color:var(--bad);border:1.5px solid #f2b8bd}
.btn.red{background:var(--bad)}
.btn.ok{background:var(--ok)}
.btn.org{background:var(--acc)}
.btn.sm2{min-height:44px;width:auto;font-size:14px;padding:8px 14px;border-radius:12px}
.btn:disabled{opacity:.55}
.btn.ld{color:transparent!important;pointer-events:none}
.btn.ld::after{content:"";position:absolute;width:20px;height:20px;border-radius:50%;border:3px solid rgba(255,255,255,.45);border-top-color:#fff;animation:spin .7s linear infinite}
.btn.sec.ld::after,.btn.dng.ld::after,.btn.gh.ld::after{border-color:rgba(29,47,224,.25);border-top-color:var(--pri)}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid #cfd6ee;border-top-color:var(--pri);animation:spin .7s linear infinite;margin:40px auto}
.btns{display:flex;flex-direction:column;gap:10px}
/* forms */
.fld{margin-bottom:12px}
.fld label{display:block;font-size:14px;color:var(--mu);margin-bottom:5px}
.rq{color:var(--bad);font-style:normal}
.fld input,.fld select,.fld textarea{width:100%;min-height:48px;padding:10px 13px;border:1.5px solid var(--bd);border-radius:12px;background:#fff;font-size:16px;outline:none}
.fld textarea{min-height:84px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--pri2);box-shadow:0 0 0 3px rgba(42,95,214,.15)}
.fld.err input,.fld.err select,.fld.err textarea{border-color:var(--bad)}
.ferr{color:var(--bad);font-size:13px;min-height:0;margin-top:3px}
.ferr:empty{display:none}
.pw{position:relative}
.pw input{padding-right:52px}
.pw .eye{position:absolute;right:2px;top:2px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--mu)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.banner{display:flex;gap:10px;padding:12px 13px;border-radius:12px;background:var(--infobg);color:#1b2a9c;font-size:14px;align-items:flex-start}
.banner.warn{background:var(--warnbg);color:var(--warn)}
.banner.bad{background:var(--badbg);color:#a31b27}
.banner.ok{background:var(--okbg);color:#0b7a3b}
.banner svg{margin-top:2px}
.banner .sp{line-height:1.4}
/* chips */
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:99px;font-size:12.5px;background:var(--infobg);color:#1b2a9c;white-space:nowrap;line-height:1.5}
.chip.a{background:var(--warnbg);color:var(--warn)}
.chip.g{background:var(--okbg);color:#0b7a3b}
.chip.r{background:var(--badbg);color:#a31b27}
.chip.n{background:#eceff7;color:var(--mu)}
.chip.p{background:#efe8ff;color:#5b2bb8}
.filters{display:flex;gap:8px;overflow-x:auto;padding:2px 14px 8px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fc{flex:none;min-height:40px;padding:6px 15px;border-radius:99px;background:#fff;border:1.5px solid var(--bd);font-size:14px;color:var(--tx)}
.fc.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.seg{display:flex;background:#e3e8f6;border-radius:14px;padding:4px;margin:12px 14px 4px}
.seg button{flex:1;min-height:44px;border-radius:11px;font-size:15px;color:var(--mu);display:flex;align-items:center;justify-content:center;gap:6px}
.seg button.on{background:#fff;color:var(--pri);box-shadow:0 2px 8px rgba(20,30,90,.1)}
.cnt{min-width:22px;height:22px;padding:0 6px;border-radius:99px;background:var(--acc);color:#fff;font-size:12px;display:inline-flex;align-items:center;justify-content:center}
/* tabs */
#tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid var(--bd);display:flex;padding-bottom:var(--sab);z-index:30;box-shadow:0 -4px 16px rgba(20,30,90,.06)}
#tabs a{flex:1;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;color:var(--mu);text-decoration:none;position:relative;padding:6px 2px}
#tabs a.on{color:var(--pri)}
#tabs a svg{width:23px;height:23px}
#tabs .bd{position:absolute;top:5px;left:50%;margin-left:6px;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--acc);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;line-height:1}
/* avatar */
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:var(--pri2);color:#fff;overflow:hidden;flex:none;width:52px;height:52px;font-size:20px}
.av img{width:100%;height:100%;object-fit:cover}
.av.lg{width:92px;height:92px;font-size:34px}
/* hero */
.hero{background:linear-gradient(135deg,#1d2fe0,#2a5fd6);color:#fff;padding:calc(16px + var(--sat)) 16px 54px;border-radius:0 0 26px 26px}
.hero .av{background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.55)}
.hero h1{font-size:21px}
.pull{margin-top:-38px}
.sw{display:flex;align-items:center;gap:14px;padding:16px;border-radius:var(--r);background:#fff;box-shadow:var(--sh);width:100%;text-align:left;min-height:84px;border:2px solid var(--bd)}
.sw.on{border-color:var(--ok);background:#f3fbf6}
.sw .tg{width:62px;height:36px;border-radius:99px;background:#c3c9dc;position:relative;flex:none;transition:background .2s}
.sw .tg::after{content:"";position:absolute;top:4px;left:4px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25);transition:transform .2s}
.sw.on .tg{background:var(--ok)}
.sw.on .tg::after{transform:translateX(26px)}
.sw .t1{font-size:18px}
.sw.on .t1{color:#0b7a3b}
.sw.ld{opacity:.7;pointer-events:none}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:13px 14px;min-height:92px;display:flex;flex-direction:column;justify-content:space-between}
.stat .v{font-size:30px;line-height:1.1;color:var(--tx)}
html[lang=en] .stat .v{font-weight:700}
.stat .k{font-size:13px;color:var(--mu)}
.stat.pri .v{color:var(--pri)}
.stat.org .v{color:var(--acc)}
.stat.grn .v{color:var(--ok)}
.stat.red .v{color:var(--bad)}
.strip{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:var(--r);background:var(--warnbg);border:1.5px solid #ffd2a8;color:#8a3d00;text-align:left;width:100%;min-height:60px}
.strip .ic{width:40px;height:40px;border-radius:12px;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.act{background:linear-gradient(135deg,#1d2fe0,#2a5fd6);color:#fff;border-radius:var(--r);padding:15px;box-shadow:0 6px 20px rgba(29,47,224,.3);text-align:left;width:100%;display:block}
.act .chip{background:rgba(255,255,255,.2);color:#fff}
.act .mu{color:rgba(255,255,255,.8)}
/* order cards */
.oc{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:13px 14px;display:block;width:100%;text-align:left;color:inherit;text-decoration:none}
.oc:active{background:#fafbff}
.oc .id{font-size:15px;letter-spacing:.2px}
.oc .ln{display:flex;gap:8px;align-items:flex-start;margin-top:7px;font-size:14px}
.oc .ln svg{margin-top:2px;color:var(--mu);width:18px;height:18px}
.oc .ft{display:flex;align-items:center;gap:8px;margin-top:11px;padding-top:10px;border-top:1px dashed var(--bd);flex-wrap:wrap}
.cod{display:inline-flex;align-items:center;gap:6px;background:var(--warnbg);color:#8a3d00;border-radius:10px;padding:5px 11px;font-size:15px}
.cod b{font-size:17px}
html[lang=en] .cod b{font-weight:700}
.paid{display:inline-flex;align-items:center;gap:5px;background:var(--okbg);color:#0b7a3b;border-radius:10px;padding:5px 11px;font-size:13.5px}
.dl{display:inline-flex;align-items:center;gap:5px;font-size:13.5px;color:var(--pri);background:var(--infobg);border-radius:10px;padding:5px 10px;font-variant-numeric:tabular-nums}
.dl.over{background:var(--badbg);color:var(--bad)}
.dl.soon{background:var(--warnbg);color:var(--warn)}
.dl svg{width:16px;height:16px}
.empty{text-align:center;padding:42px 24px;color:var(--mu)}
.empty svg{width:54px;height:54px;color:#b9c1dc;stroke-width:1.5;margin:0 auto 10px;display:block}
.empty h3{font-size:17px;color:var(--tx);margin-bottom:4px}
.err-box{text-align:center;padding:30px 20px}
.err-box svg{width:46px;height:46px;color:var(--bad);margin:0 auto 8px;display:block}
/* detail */
.kv{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid #eef1f8;align-items:flex-start}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--mu);font-size:13.5px;width:116px;flex:none}
.kv .v{flex:1;min-width:0;word-break:break-word}
.items .it{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid #eef1f8;align-items:flex-start}
.items .it:last-child{border-bottom:0}
.items .th{width:52px;height:52px;border-radius:10px;background:#f1f3f9;overflow:hidden;flex:none;display:flex;align-items:center;justify-content:center;font-size:24px}.items .th img{width:100%;height:100%;object-fit:cover}
.items .nm{display:block}.items .va{display:inline-block;margin-top:3px;font-size:12.5px;background:#f3f0ff;color:#5b3fc4;border-radius:7px;padding:1px 8px}
.stop{border:1.5px solid var(--bd);border-radius:14px;padding:12px;margin-top:10px}.stop:first-of-type{margin-top:0}
.stop .sh{display:flex;gap:10px;align-items:center}.stop .lg{width:48px;height:48px;border-radius:12px;background:#eef1f8;overflow:hidden;flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--pri2)}.stop .lg img{width:100%;height:100%;object-fit:cover}
.stop .no{font-size:12px;color:var(--mu)}.stop .ow{display:flex;gap:9px;align-items:center;margin-top:10px;padding-top:10px;border-top:1px dashed var(--bd)}.stop .ow .ph{width:38px;height:38px;border-radius:50%;background:#eef1f8;overflow:hidden;flex:none}.stop .ow .ph img{width:100%;height:100%;object-fit:cover}
.stop .ad{display:flex;gap:8px;align-items:flex-start;margin-top:9px;font-size:14px}.stop .ad .i{flex:none;margin-top:2px}
.stop .two2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.stop .two2 .nav{min-height:44px;font-size:14.5px}
.stop .col{margin-top:10px;background:#f8f9fd;border-radius:12px;padding:4px 10px}.stop .col h3{font-size:13px;color:var(--mu);margin:6px 0 2px}
.ocths{display:flex;gap:6px;margin-top:9px}.ocths span{width:40px;height:40px;border-radius:9px;background:#f1f3f9;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--mu)}.ocths img{width:100%;height:100%;object-fit:cover}
.msn{display:flex;gap:10px;align-items:flex-start;padding:12px 13px;border-radius:12px;background:#fff8e6;border:1px solid #ffe2a6;color:#7a4b00;font-size:14px}
.items .q{background:var(--infobg);color:#1b2a9c;border-radius:8px;min-width:34px;height:28px;display:flex;align-items:center;justify-content:center;font-size:13px;flex:none}
.sum{display:flex;justify-content:space-between;padding:4px 0}
.sum.t{border-top:1.5px solid var(--bd);margin-top:6px;padding-top:9px;font-size:17px}
html[lang=en] .sum.t{font-weight:700}
.cash{background:linear-gradient(135deg,#fff1e3,#ffe2c6);border:2px solid #ffb877;border-radius:var(--r);padding:14px;text-align:center;color:#8a3d00}
.cash .am{font-size:34px;line-height:1.2;color:#c24d00}
html[lang=en] .cash .am{font-weight:700}
.nav{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;border-radius:14px;background:var(--pri2);color:#fff;text-decoration:none;font-size:16px;width:100%}
.nav.o{background:#fff;color:var(--pri2);border:1.5px solid var(--pri2)}
.call{display:inline-flex;align-items:center;gap:6px;color:var(--pri2);text-decoration:none;min-height:44px}
.stp{list-style:none;margin:0;padding:0}
.stp li{display:flex;gap:12px;align-items:center;position:relative;padding:6px 0;min-height:40px;color:var(--mu)}
.stp li::before{content:"";position:absolute;left:11px;top:-14px;bottom:50%;width:2px;background:#d7dcec}
.stp li:first-child::before{display:none}
.stp li.dn::before,.stp li.cu::before{background:var(--ok)}
.stp .dot{width:24px;height:24px;border-radius:50%;background:#e1e5f2;flex:none;display:flex;align-items:center;justify-content:center;position:relative;z-index:1;color:#fff}
.stp .dot svg{width:14px;height:14px;stroke-width:3}
.stp li.dn{color:var(--tx)}
.stp li.dn .dot{background:var(--ok)}
.stp li.cu{color:var(--pri);font-size:16px}
.stp li.cu .dot{background:var(--pri);box-shadow:0 0 0 5px rgba(29,47,224,.15)}
.abar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid var(--bd);padding:10px 14px calc(10px + var(--sab));display:flex;flex-direction:column;gap:8px;z-index:30;box-shadow:0 -6px 20px rgba(20,30,90,.08)}
.abar .two .btn{min-height:48px;font-size:15px}
/* sheet */
#sheet{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end;justify-content:center}
.sbk{position:absolute;inset:0;background:rgba(15,20,50,.55);animation:fade .2s}
.sh{position:relative;width:100%;max-width:480px;max-height:92vh;overflow:auto;background:#fff;border-radius:22px 22px 0 0;padding:8px 16px calc(18px + var(--sab));animation:up .25s ease-out;overscroll-behavior:contain}
.sgrab{width:44px;height:5px;border-radius:9px;background:#d5daea;margin:4px auto 12px}
.sh h2{font-size:19px;margin-bottom:6px}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
body.nosc{overflow:hidden}
.rad{display:flex;align-items:center;gap:12px;min-height:50px;padding:8px 12px;border:1.5px solid var(--bd);border-radius:12px;margin-bottom:8px;cursor:pointer}
.rad input{width:20px;height:20px;accent-color:var(--pri);flex:none}
.rad.on{border-color:var(--pri);background:#f4f6ff}
.otp{position:relative;display:flex;gap:10px;justify-content:center;margin:14px 0 6px}
.otp .bx{width:56px;height:64px;border:2px solid var(--bd);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:30px;background:#fff;font-variant-numeric:tabular-nums}
.otp .bx.cur{border-color:var(--pri);box-shadow:0 0 0 4px rgba(29,47,224,.12)}
.otp.bad .bx{border-color:var(--bad);animation:shake .35s}
.otp input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;border:0;background:transparent;caret-color:transparent}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.done{position:fixed;inset:0;z-index:200;background:linear-gradient(160deg,#12a150,#0b7a3b);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;animation:fade .25s;text-align:center;padding:24px}
.done .ck{width:96px;height:96px;border-radius:50%;background:#fff;color:var(--ok);display:flex;align-items:center;justify-content:center;animation:pop .45s}
.done .ck svg{width:52px;height:52px;stroke-width:3}
.done h1{font-size:28px}
@keyframes pop{from{transform:scale(.3);opacity:0}60%{transform:scale(1.12)}}
/* toast */
#toasts{position:fixed;left:0;right:0;top:calc(10px + var(--sat));z-index:300;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 12px}
.toast{max-width:456px;width:100%;background:#151a2d;color:#fff;border-radius:14px;padding:12px 15px;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.3);animation:tin .25s;display:flex;gap:10px;align-items:center;pointer-events:auto}
.toast.ok{background:#0b7a3b}
.toast.bad{background:#b3222e}
.toast.new{background:var(--acc)}
.toast svg{width:20px;height:20px}
@keyframes tin{from{transform:translateY(-14px);opacity:0}}
/* auth */
.auth{padding:calc(26px + var(--sat)) 18px 24px}
.logo{display:flex;align-items:center;gap:12px;justify-content:center;margin:8px 0 6px}
.logo .mk{width:54px;height:54px;border-radius:16px;background:linear-gradient(135deg,#1d2fe0,#2a5fd6);display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 6px 18px rgba(29,47,224,.35)}
.logo .mk svg{width:30px;height:30px}
.logo .nm{font-size:25px;color:var(--pri);line-height:1.1}
.logo .nm small{display:block;font-size:13px;color:var(--acc);letter-spacing:2.5px;text-transform:uppercase}

    });
  } catch (e) {}
}

var REP = {

};
function uploadEvidence(file) {
  return new Promise(function (res, rej) {
    var x = new XMLHttpRequest();
    x.open('POST', API + '/rider/reports/upload');
    x.setRequestHeader('Authorization', 'Bearer ' + S.tok);
    x.timeout = 120000;
    x.onload = function () {
      var j = null; try { j = JSON.parse(x.responseText); } catch (e) {}
      if (x.status >= 200 && x.status < 300 && j && j.name) return res(j.name);
      if (x.status === 401 && S.tok) onUnauth();
      rej({ status: x.status, error: (j && j.error) || '', field: 'evidence', code: (j && j.code) || '' });
    };
    x.onerror = x.ontimeout = function () { rej({ status: 0, network: true }); };
    var fd = new FormData(); fd.append('file', file, file.name || 'evidence.jpg');
    x.send(fd);
  });
}

function nmLegend(o) {
  var h = '';
  if ((o.pickups || []).some(function (p) { return p.lat != null; })) h += '<span><i style="background:#ff6a00"></i>' + nmE(nmT('Shop pickup', 'দোকান (পিকআপ)')) + '</span>';
  if ((o.delivery || {}).lat != null) h += '<span><i style="background:#1d2fe0"></i>' + nmE(nmT('Customer pin', 'কাস্টমারের পিন')) + '</span>';
  if (o.live) h += '<span><i style="background:#16a34a"></i>' + nmE(nmT('Customer live', 'কাস্টমার লাইভ')) + '</span>';
  return h;
}
function nmGeoRows(g, z) {
  var rows = [[nmT('Delivery zone', 'ডেলিভারি জোন'), z ? (S.lang === 'en' ? z.n : (z.bn || z.n)) : ''], [nmT('Area', 'এলাকা'), g.area], [nmT('City', 'শহর'), g.city], [nmT('Post office', 'পোস্ট অফিস'), g.post], [nmT('Landmark', 'ল্যান্ডমার্ক'), g.landmark]].filter(function (r) { return r[1]; });
  if (!rows.length) return '';
  return '<div style="margin-top:10px">' + rows.map(function (r) { return '<div class="kv"><div class="k">' + nmE(r[0]) + '</div><div class="v">' + nmE(r[1]) + '</div></div>'; }).join('') + '</div>';
}
function rmapDraw(o) {
  try {
    var host = nmD.getElementById('rmapc');
    if (!host) return;
    if (nmRM && nmRM.ctl) { try { nmRM.ctl.destroy(); } catch (e) { } }
    nmRM = null;
    var pts = nmPoints(o);
    if (!pts.length) {
      host.innerHTML = isFinal(o.rstat) ? '' : '<div class="card"><div class="sm mu">' + nmE(nmT('No map pin yet: the customer gave only a written address, and the shop has not set a map location.', 'এখনো কোনো ম্যাপ পিন নেই: কাস্টমার শুধু লিখিত ঠিকানা দিয়েছেন, আর দোকানও ম্যাপ লোকেশন দেয়নি।')) + '</div></div>';
      return;
    }
    host.innerHTML = '<div class="card"><h2 class="h">' + nmE(nmT('Map', 'ম্যাপ')) + '</h2><div class="rmap" id="rmapbox"></div><div class="rleg">' + nmLegend(o) + '</div><div id="rmlv">' + nmLiveHtml(o) + '</div>' +
      (o.delivery && o.delivery.geo ? nmGeoRows(o.delivery.geo, o.delivery.zone) : '') + '</div>';
    nmRM = { oid: o.id, ctl: window.NBMap.viewer(nmD.getElementById('rmapbox'), { points: pts }) };
  } catch (e) { /* the order page must never break because of the map */ }
}
function rmapLive(o) {
  if (!nmRM || nmRM.oid !== o.id || !nmRM.ctl) return;
  var lv = nmD.getElementById('rmlv');
  if (lv) lv.innerHTML = nmLiveHtml(o);
  nmRM.ctl.update(nmPoints(o), false);
}
// follow the moving customer more often than the 15 s page poll, only while an unfinished order is open
setInterval(function () {
  try {
    if (nmD.hidden || S.route.name !== 'order' || !CUR || isFinal(CUR.rstat) || !nmRM || nmRM.oid !== CUR.id) return;
    api('GET', '/rider/orders/' + encodeURIComponent(S.route.arg)).then(function (d) {
      if (d && d.order && S.route.name === 'order') { CUR = d.order; rmapLive(d.order); }
    }, function () { });
  } catch (e) { }
}, 7000);

/*NBGM-RIDER:END*/
(function init() {
  var l = lsGet('nbr_lang'); if (l === 'en' || l === 'bn') S.lang = l; document.documentElement.lang = S.lang;
  var t = lsGet('nbr_tok'); if (t) S.tok = t;
  if (!API) { $('#view').innerHTML = '<div class="err-box">' + ic('alert') + '<p>config.js missing (NB_API)</p></div>'; return; }
  if (!location.hash) { try { history.replaceState(null, '', '#/' + (S.tok ? 'home' : 'login')); } catch (e) {} }
  render();
})();
})();
</script>
</body>
