<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>NurBuy Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Tiro+Bangla&display=swap" rel="stylesheet">
<style>
:root{--br:#4a52c8;--br2:#6a5be2;--bg:#f3f5fb;--cd:#fff;--tx:#1b2147;--mu:#6b7499;--bd:#e4e8f4;--ok:#16a34a;--wa:#f59e0b;--er:#e11d48;--in:#2563eb;--sb:#12163a;--r:14px}
*{box-sizing:border-box;margin:0;padding:0}html{-webkit-text-size-adjust:100%}
body{font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Bengali","Hind Siliguri",sans-serif;background:var(--bg);color:var(--tx)}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}input,select,textarea{font:inherit;color:inherit}
.hide{display:none!important}
/* Bengali readability: larger, darker, no letter-spacing (it breaks conjuncts and blurs glyphs) */
html[lang=bn] body,html[lang=bn] button,html[lang=bn] input,html[lang=bn] select,html[lang=bn] textarea{font-family:'Tiro Bangla','Noto Sans Bengali','Hind Siliguri',system-ui,sans-serif}
html[lang=bn] body,html[lang=bn] body *:not(.bss,.bss *){font-weight:400!important;font-synthesis:none}
html[lang=bn]{--mu:#4a5379}
html[lang=bn] body{font-size:16px;line-height:1.7;letter-spacing:0;text-rendering:optimizeLegibility;-webkit-font-smoothing:auto}
html[lang=bn] *:not(.bss,.bss *){letter-spacing:0!important}
html[lang=bn] #nv .ni{font-size:17px;line-height:1.25;padding:8px 14px;margin-bottom:1px;font-weight:600}html[lang=bn] #nv .ng{font-size:13.5px;line-height:1.2;padding:12px 12px 4px}html[lang=bn] #nv .ni b{font-size:12px;line-height:1.4}html[lang=bn] #sb .lo small{line-height:1.2}
html[lang=bn] body{font-weight:500}html[lang=bn] .ni{color:#eceeff;font-weight:600}html[lang=bn] .ng{color:#a9aff0}html[lang=bn] #nv .ni.on{color:#fff}html[lang=bn] .gt{fill:#4a5379}html[lang=bn] input::placeholder{color:#6a7399}body[data-av=min]{}html[lang=bn] body[data-av=min] .ni{color:#f6e6d6}
html[lang=bn] th,html[lang=bn] .ng,html[lang=bn] .pop .pt,html[lang=bn] #sb .lo small{text-transform:none;font-size:13px}
html[lang=bn] .ni{font-size:15px}html[lang=bn] .pill{font-size:13px;padding:3px 11px}
html[lang=bn] .kv span{font-size:15px}html[lang=bn] .kv b{font-size:23px}html[lang=bn] .cd h3{font-size:17px}html[lang=bn] .kv small{font-size:14px}html[lang=bn] .sb,html[lang=bn] .rt small,html[lang=bn] .ti small,html[lang=bn] .al .at small,html[lang=bn] .cs small,html[lang=bn] .fl>span{font-size:13px}
html[lang=bn] .ti b,html[lang=bn] .al .at b{font-size:14.5px}html[lang=bn] .bt.sm,html[lang=bn] .tabs button,html[lang=bn] .kp-chip,html[lang=bn] .po{font-size:13.5px}html[lang=bn] .gt{font-size:12px}
html[lang=bn] .hint,html[lang=bn] .ph{font-size:13px}
/* login */
#lg{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#12163a,#3b3fa8 60%,#6a5be2)}
.lgc{background:#fff;border-radius:20px;padding:30px 26px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.lgc .lo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;color:var(--br);margin-bottom:4px}.lo i{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--br),var(--br2));color:#fff;display:grid;place-items:center;font-style:normal;font-size:20px}
.lgc p.s{color:var(--mu);margin-bottom:18px}
.fl{display:block;margin-bottom:12px}.fl>span{display:block;font-weight:600;font-size:12.5px;color:var(--mu);margin-bottom:5px}
.in{width:100%;border:1.5px solid var(--bd);border-radius:10px;padding:10px 12px;background:#fff;outline:0}.in:focus{border-color:var(--br);box-shadow:0 0 0 3px rgba(74,82,200,.15)}
textarea.in{min-height:70px;resize:vertical}
.bt{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:10px;font-weight:700;background:var(--br);color:#fff;transition:.15s}.bt:hover{filter:brightness(1.1)}
.bt.w{width:100%;padding:12px}.bt.g{background:#eef0fb;color:var(--br)}.bt.d{background:#fde8ec;color:var(--er)}.bt.ok{background:#e3f6ea;color:var(--ok)}.bt.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.pw{position:relative;display:block}.pw .in{padding-right:44px}.eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:38px;height:38px;display:grid;place-items:center;color:var(--mu);border-radius:8px}.eye:hover{color:var(--br)}.er{color:var(--er);font-size:13px;min-height:18px;margin:2px 0 8px}
.hint{font-size:12px;color:var(--mu);margin-top:12px;background:#f3f5fb;padding:8px 10px;border-radius:8px}
/* shell */
#app{display:flex;min-height:100vh}
#sb{width:250px;background:var(--sb);color:#c9cdf0;position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;z-index:40;transition:transform .25s}
#sb .lo{display:flex;align-items:center;gap:10px;color:#fff;font-weight:800;font-size:19px;padding:18px 18px 14px}
#sb .lo i{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--br),var(--br2));display:grid;place-items:center;font-style:normal}
#sb .lo small{display:block;font-size:10.5px;font-weight:600;color:#8f95d4;letter-spacing:.5px;text-transform:uppercase}
#nv{flex:1;overflow:auto;padding:6px 10px 14px}
.ng{font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:#6f75b8;padding:14px 10px 5px;font-weight:700}
.ni{display:flex;align-items:center;gap:11px;width:100%;padding:10px 14px;border-radius:10px;color:#c9cdf0;font-weight:600;text-align:left;margin-bottom:2px}
.ni:hover{background:rgba(255,255,255,.07)}.ni.on{background:linear-gradient(90deg,var(--br),var(--br2));color:#fff}
.nrw{position:relative}.nrw .ni{padding-right:46px}.nx{position:absolute;right:6px;top:50%;transform:translateY(-50%);margin-top:-1px;width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:#c9cdf0;cursor:pointer}.nx:hover{background:rgba(255,255,255,.12);color:#fff}.nx svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}.nx.o svg{transform:rotate(180deg)}
.nsub{margin:0 0 4px 20px;padding-left:10px;border-left:1px solid rgba(255,255,255,.16)}.ni.ns{padding:8px 12px;font-size:14px;font-weight:500}
.ni .ic{width:20px;text-align:center;font-size:16px}.ni b{margin-left:auto;background:var(--er);color:#fff;border-radius:20px;font-size:11px;padding:1px 7px}
#mn{margin-left:250px;flex:1;min-width:0;display:flex;flex-direction:column}
#tp{position:sticky;top:0;z-index:30;background:rgba(243,245,251,.92);backdrop-filter:blur(8px);display:flex;align-items:center;gap:12px;padding:12px 24px;border-bottom:1px solid var(--bd)}
#tp h1{font-size:19px;font-weight:800;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mb{display:none;width:38px;height:38px;border-radius:10px;background:#fff;border:1px solid var(--bd);font-size:18px}
.vt{display:flex;background:#fff;border:1px solid var(--bd);border-radius:12px;padding:3px}.vt button{padding:6px 14px;border-radius:9px;font-weight:800;font-size:13px;color:var(--mu)}.vt button.on{background:linear-gradient(135deg,var(--br),var(--br2));color:#fff}body[data-av=min]{--br:#ea580c;--br2:#f59e0b}body[data-av=min] #sb{background:#241408}body[data-av=min] .ni{color:#e8d3c0}body[data-av=min] .ni.on{color:#fff}.chip{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:7px 11px;font-weight:700;font-size:13px}
.av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--br),var(--br2));color:#fff;display:grid;place-items:center;font-weight:800}
.av{overflow:hidden;flex:none}.av.avp{background:#eef0fb}.av img{width:100%;height:100%;object-fit:cover;display:block}
#pg{padding:22px 24px 60px;max-width:1500px;width:100%}
.ov{position:fixed;inset:0;background:rgba(10,12,40,.5);z-index:35;display:none}
/* cards */
.gr{display:grid;gap:16px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.g21{grid-template-columns:2fr 1fr}
.gr>*{min-width:0}.sup{grid-template-columns:300px 1fr}.cd{background:var(--cd);border:1px solid var(--bd);border-radius:var(--r);padding:18px;box-shadow:0 1px 3px rgba(30,40,100,.04)}
.cd h3{font-size:15px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px}.cd h3 .sp{margin-left:auto;font-size:12px;font-weight:600;color:var(--mu)}
.kp{display:flex;align-items:center;gap:14px}.kp .ki{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font-size:22px}
.kp small{color:var(--mu);font-weight:600;display:block}.kp b{font-size:22px;font-weight:800}.kp em{font-style:normal;font-size:12px;font-weight:700}
.up{color:var(--ok)}.dn{color:var(--er)}
/* table */
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:var(--r);background:#fff}
table{width:100%;border-collapse:collapse;min-width:640px}th{background:#f7f8fd;color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:.4px;text-align:left;padding:11px 14px;white-space:nowrap}
td{padding:11px 14px;border-top:1px solid var(--bd);vertical-align:middle}tr.cl{cursor:pointer}tr.cl:hover td{background:#fafbff}
.pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700;white-space:nowrap}
.p-ok{background:#e3f6ea;color:#15803d}.p-wa{background:#fff3d6;color:#b45309}.p-er{background:#fde8ec;color:#be123c}.p-in{background:#e3ecff;color:#1d4ed8}.p-mu{background:#eceef7;color:#5a6286}.p-pu{background:#efe7ff;color:#6d28d9}
.tb{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}.tb .in{width:auto;min-width:160px;flex:0 1 auto}.tb .sx{flex:1;min-width:180px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}.tabs button{padding:7px 13px;border-radius:20px;background:#fff;border:1px solid var(--bd);font-weight:700;font-size:13px;color:var(--mu)}.tabs button.on{background:var(--br);border-color:var(--br);color:#fff}
.th{width:38px;height:38px;border-radius:10px;background:#f1f3fc;display:grid;place-items:center;font-size:20px}
.row{display:flex;align-items:center;gap:10px}.sp1{flex:1}
/* modal/drawer */
#md{position:fixed;inset:0;background:rgba(10,12,40,.55);z-index:60;display:none;align-items:center;justify-content:center;padding:16px}
#md.o{display:flex}.mb{background:#fff;border-radius:18px;width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.mb.wd{max-width:760px}.mb h2{font-size:18px;margin-bottom:14px;display:flex;align-items:center}.mb h2 button{margin-left:auto;font-size:22px;color:var(--mu)}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.fti{border:1px solid var(--bd);border-radius:12px;padding:12px 12px 2px;margin-bottom:10px;background:#fafbff}.fti .ftn{font-weight:700;font-size:13px;margin-bottom:8px;color:var(--tx)}.in.bad{border-color:var(--er)}.fth{color:var(--mu);font-size:12px;margin:0 0 10px;line-height:1.5}.fth code{background:#eef0fb;border-radius:5px;padding:1px 5px;font-size:11.5px}.fg .full{grid-column:1/-1}
.ac{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
#ts{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(30px);background:#12163a;color:#fff;padding:11px 18px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:80;max-width:90vw}#ts.o{opacity:1;transform:translateX(-50%)}
/* misc */
.bar{height:8px;border-radius:8px;background:#eceffa;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--br),var(--br2));border-radius:8px}
.sw{position:relative;width:42px;height:24px;display:inline-block;flex:none}.sw input{opacity:0;width:0;height:0}.sw s{position:absolute;inset:0;background:#cdd2ea;border-radius:24px;transition:.2s}.sw s:before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}.sw input:checked+s{background:var(--ok)}.sw input:checked+s:before{transform:translateX(18px)}
.tl{display:flex;gap:0;margin:6px 0 14px;overflow-x:auto}.tl div{flex:1;min-width:70px;text-align:center;font-size:11.5px;font-weight:700;color:var(--mu);position:relative;padding-top:22px}.tl div:before{content:"";position:absolute;top:6px;left:50%;width:12px;height:12px;border-radius:50%;background:#d6daee;transform:translateX(-50%);z-index:1}.tl div:after{content:"";position:absolute;top:11px;left:-50%;width:100%;height:2px;background:#d6daee}.tl div:first-child:after{display:none}.tl div.d{color:var(--br)}.tl div.d:before,.tl div.d:after{background:var(--br)}
.hv{border-radius:14px;padding:16px 18px;color:#fff;min-height:96px;display:flex;align-items:center;gap:14px}.hv .e{font-size:44px}.hv b{font-size:18px;display:block}.hv span{opacity:.9;font-size:13px}
.sq{border:1px solid var(--bd);border-radius:14px;padding:14px;text-align:center;background:#fafbff}.sq .e{font-size:48px}
.empty{padding:40px;text-align:center;color:var(--mu)}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:#0f1330;color:#c8ceff;padding:12px;border-radius:10px;overflow:auto;white-space:pre;max-height:240px}
.cr{display:flex;align-items:flex-end;gap:6px;height:170px}.cr div{flex:1;background:linear-gradient(180deg,var(--br2),var(--br));border-radius:6px 6px 0 0;min-height:4px;position:relative}.cr div:hover:after{content:attr(data-v);position:absolute;top:-24px;left:50%;transform:translateX(-50%);background:#12163a;color:#fff;font-size:11px;padding:2px 7px;border-radius:6px;white-space:nowrap}
.cl2{display:flex;gap:6px;margin-top:6px}.cl2 span{flex:1;text-align:center;font-size:10.5px;color:var(--mu)}
.msg{max-width:78%;padding:9px 12px;border-radius:12px;margin-bottom:8px;background:#eef0fb}.msg.me{background:var(--br);color:#fff;margin-left:auto}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.g21{grid-template-columns:1fr}.g3{grid-template-columns:1fr 1fr}}
@media(max-width:860px){.sup{grid-template-columns:1fr}#sb{transform:translateX(-100%)}#sb.o{transform:none}#mn{margin-left:0}#mb{display:block}#tp,#pg{padding-left:14px;padding-right:14px}.ov.o{display:block}.g3,.g2{grid-template-columns:1fr}.fg{grid-template-columns:1fr}}
button:focus-visible,.in:focus-visible,tr.cl:focus-visible,select:focus-visible{outline:2px solid var(--br);outline-offset:2px}
.th.big{width:56px;height:56px;border-radius:14px;font-size:24px;margin:0 auto 8px}.th.mt{color:var(--mu);font-weight:600}.th{font-weight:800;color:var(--br);font-size:16px}
.ki svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.al .ad{width:10px;height:10px;border-radius:50%;background:var(--in);flex:none}.al-warn .ad{background:var(--wa)}.al-danger .ad{background:var(--er)}
.tk:after{content:"";width:10px;height:10px;border-radius:50%;background:var(--br)}
.kd{position:relative;margin-top:9px}.kp-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:9px;background:#f1f3fc;color:var(--br);font-weight:700;font-size:12px;border:1px solid transparent}.kp-chip:hover,.kp-chip.on{border-color:var(--br);background:#fff}.kp-chip svg{flex:none}
.pop{position:absolute;left:0;top:calc(100% + 6px);z-index:30;width:230px;background:#fff;border:1px solid var(--bd);border-radius:14px;box-shadow:0 12px 36px rgba(20,25,80,.2);padding:10px}
.pop .pt{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--mu);font-weight:800;padding:2px 6px 6px}
.po{display:flex;align-items:center;width:100%;text-align:left;padding:8px 10px;border-radius:9px;font-weight:600;font-size:13px}.po:hover{background:#f3f5fb}.po.on{background:#eef0fb;color:var(--br)}.po span{flex:1}.po i{font-style:normal;font-weight:800}
.pc{border-top:1px solid var(--bd);margin-top:6px;padding-top:6px}.pr{display:flex;align-items:center;gap:6px;padding:0 4px 8px}.pr span{font-size:13px;color:var(--mu)}.pr .in{padding:6px 8px;width:auto;min-width:0}.pr input{width:64px}.pr select{flex:1}.w2{width:100%}.ph{color:var(--er);font-size:12px;min-height:14px;padding:4px 4px 0}
@media(max-width:520px){.pop{width:min(260px,calc(100vw - 60px))}}
/* images, cards */
.pim{display:grid;place-items:center;width:56px;height:56px;border-radius:12px;background:#f1f3fc;color:#9aa3cf;overflow:hidden;flex:none}.pim img{width:100%;height:100%;object-fit:cover;display:block}.pim svg{width:46%;height:46%}.pim.sm{width:38px;height:38px;border-radius:10px}.pim.lg{width:84px;height:84px;border-radius:16px}
.vim{display:grid;place-items:center;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--br),var(--br2));color:#fff;font-weight:800;font-size:22px;overflow:hidden;flex:none;position:relative}.vim img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.vim.sm{width:38px;height:38px;font-size:15px}.vim.lg{width:76px;height:76px;font-size:30px}.vim.xl{width:92px;height:92px;font-size:36px}
.tr5{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}.tc{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:18px 12px 14px;border:1px solid var(--bd);border-radius:14px;background:#fff;transition:.15s}.tc:hover{border-color:var(--br);box-shadow:0 6px 18px rgba(30,40,110,.1);transform:translateY(-2px)}
.tc .tn{font-size:14px;line-height:1.3;margin-top:4px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tc .tv{font-size:17px;font-weight:800;color:var(--br)}.tc small{color:var(--mu);font-size:12px}.rkb{position:absolute;top:8px;left:8px;min-width:22px;height:22px;border-radius:7px;background:#eef0fb;color:var(--br);font-size:12px;font-weight:800;display:grid;place-items:center;padding:0 5px}.vc{padding:22px 12px 16px}.vc .tv{font-size:19px}
.dh{display:flex;gap:16px;align-items:center;margin-bottom:14px}.dn1{font-size:20px;font-weight:800}.ds{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.dsb{background:#f7f8fd;border-radius:12px;padding:11px 13px;min-width:0}.dsb span{display:block;color:var(--mu);font-size:12px;font-weight:600}.dsb b{font-size:16px}.lk{color:var(--br);font-weight:800;text-decoration:underline;padding:0}
.tl2.two{display:grid;grid-template-columns:1fr 1fr;column-gap:30px}
@media(max-width:1100px){.tr5{display:flex;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x proximity}.tr5>*{flex:0 0 190px;scroll-snap-align:start}.ds{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){.tl2.two{grid-template-columns:1fr}.dh{flex-wrap:wrap}}
/* dashboard */
.kpis{gap:14px}.kp{align-items:flex-start;gap:13px;padding:16px}.kp .ki{flex:none}.kv{min-width:0}.kv span{display:block;color:var(--mu);font-weight:600;font-size:12.5px}.kv b{display:block;font-size:22px;font-weight:800;margin:1px 0 2px;letter-spacing:-.3px;white-space:nowrap}.kv small{font-size:11.5px;font-weight:600;color:var(--mu)}.kv small.up{color:var(--ok)}.kv small.dn{color:var(--er)}
.tabs.sm button{padding:4px 11px;font-size:12px}.cd h3 .sp{margin-left:auto}

Object.assign(AW, {
  sdcov: function (i) {
    var r = F.sdata; if (!r || r.id != i) return;
    CV = { sid: +i, ids: {}, nm: {}, par: {}, kids: {}, open: {}, top: null, q: '', busy: 0 };

  },

    i = +i; CV.open[i] = !CV.open[i]; cvDraw();
    if (CV.open[i] && !CV.kids[i]) api('GET', '/admin/loc/min?parent=' + i).then(function (d) { CV.kids[i] = d.items || []; cvReg(CV.kids[i], i); cvDraw(); }).catch(function (e) { toast(e.message); });
  },

document.addEventListener('change', function (e) {
  var t = e.target; if (!t || !t.dataset || t.dataset.cv == null || !$('cvl')) return;

});

else{var w=40,h=w*cv[0]/cv[1]*(ratio||.6);if(h>90){h=90;w=h/((cv[0]/cv[1])*(ratio||.6))}l=Object.assign(base,{type:'image',x:Math.round((100-w)/2),y:Math.round((100-h)/2),w:+w.toFixed(1),h:+h.toFixed(1),src:src,fit:'cover',radius:0})}
