<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d2fe0">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light">
<title>NurBuy Seller</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Tiro+Bangla&display=swap" rel="stylesheet">
<style>
:root{
  --pri:#1d2fe0;--pri2:#2a5fd6;--acc:#ff6a00;--tx:#151a2d;--mu:#6b7390;--bg:#f1f4fa;--bd:#e3e7f2;--card:#fff;
  --ok:#12a150;--okbg:#e4f6ec;--bad:#d92d3a;--badbg:#fdeaec;--warn:#b45309;--warnbg:#fff1e3;--infobg:#e8edff;
  --sh:0 4px 16px rgba(20,30,90,.08);--r:16px;--sw:244px;
  --fb:'Hind Siliguri',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--fh:'Tiro Bangla','Hind Siliguri',serif;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:400 15px/1.45 var(--fb);min-height:100vh}
html[lang=bn] body *{font-weight:400!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:disabled{cursor:not-allowed}
a{color:var(--pri2)}
h1,h2,h3,p{margin:0}
[hidden]{display:none!important}
:focus-visible{outline:3px solid rgba(42,95,214,.45);outline-offset:2px}
#app{min-height:100vh;padding-bottom:calc(76px + var(--sab))}
#app.notabs{padding-bottom:calc(24px + var(--sab))}
#main{min-width:0}
.h{font-family:var(--fh);font-weight:400}
html[lang=en] .h{font-family:var(--fb);font-weight:700}
html[lang=en] .b6{font-weight:600}
html[lang=en] .b7{font-weight:700}
.bar{display:flex;align-items:center;gap:8px;padding:calc(10px + var(--sat)) 14px 10px;background:#fff;border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:20;min-height:56px}
.bar h1{font-size:19px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{width:44px;height:44px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;color:var(--tx);flex:none}
.ib:active{background:var(--bg)}
.ib svg{width:22px;height:22px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.pg{padding:14px 14px 8px;max-width:1120px;margin:0 auto}
.nar{max-width:720px;margin-left:auto;margin-right:auto}
.gap{display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:14px;border:1px solid transparent}
.card h2{font-size:16px;margin-bottom:8px}
.mu{color:var(--mu)}
.sm{font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1;min-width:0}
.tc{text-align:center}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;padding:10px 18px;border-radius:14px;background:var(--pri);color:#fff;font-size:16px;text-align:center;position:relative;transition:transform .08s,opacity .15s;text-decoration:none}
.btn:active{transform:scale(.985)}
.btn.sec{background:#fff;color:var(--pri);border:1.5px solid var(--pri)}
.btn.gh{background:transparent;color:var(--pri2)}
.btn.dng{background:#fff;color:var(--bad);border:1.5px solid #f2b8bd}
.btn.red{background:var(--bad)}
.btn.ok{background:var(--ok)}
.btn.org{background:var(--acc)}
.btn.sm2{min-height:44px;width:auto;font-size:14px;padding:8px 14px;border-radius:12px}
.btn:disabled{opacity:.55}
.btn.ld{color:transparent!important;pointer-events:none}
.btn.ld::after{content:"";position:absolute;width:20px;height:20px;border-radius:50%;border:3px solid rgba(255,255,255,.45);border-top-color:#fff;animation:spin .7s linear infinite}
.btn.sec.ld::after,.btn.dng.ld::after,.btn.gh.ld::after{border-color:rgba(29,47,224,.25);border-top-color:var(--pri)}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid #cfd6ee;border-top-color:var(--pri);animation:spin .7s linear infinite;margin:40px auto}
.btns{display:flex;flex-direction:column;gap:10px}
.btns.h2{flex-direction:row;flex-wrap:wrap}
.btns.h2 .btn{flex:1;min-width:140px}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:14px;color:var(--mu);margin-bottom:5px}
.rq{color:var(--bad);font-style:normal}
.fld input,.fld select,.fld textarea{width:100%;min-height:48px;padding:10px 13px;border:1.5px solid var(--bd);border-radius:12px;background:#fff;font-size:16px;outline:none}
.fld textarea{min-height:84px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--pri2);box-shadow:0 0 0 3px rgba(42,95,214,.15)}
.fld.err input,.fld.err select,.fld.err textarea{border-color:var(--bad)}
.ferr{color:var(--bad);font-size:13px;margin-top:3px}
.ferr:empty{display:none}
.pw{position:relative}
.pw input{padding-right:52px}
.pw .eye{position:absolute;right:2px;top:2px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--mu)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.banner{display:flex;gap:10px;padding:12px 13px;border-radius:12px;background:var(--infobg);color:#1b2a9c;font-size:14px;align-items:flex-start}
.banner.warn{background:var(--warnbg);color:var(--warn)}
.banner.bad{background:var(--badbg);color:#a31b27}
.banner.ok{background:var(--okbg);color:#0b7a3b}
.banner svg{margin-top:2px}
.banner .sp{line-height:1.4}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:99px;font-size:12.5px;background:var(--infobg);color:#1b2a9c;white-space:nowrap;line-height:1.5}
.chip.a{background:var(--warnbg);color:var(--warn)}
.chip.g{background:var(--okbg);color:#0b7a3b}
.chip.r{background:var(--badbg);color:#a31b27}
.chip.n{background:#eceff7;color:var(--mu)}
.chip.p{background:#efe8ff;color:#5b2bb8}
.filters{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fc{flex:none;min-height:40px;padding:6px 15px;border-radius:99px;background:#fff;border:1.5px solid var(--bd);font-size:14px;color:var(--tx);display:inline-flex;align-items:center;gap:6px}
.fc.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.fc .c2{font-size:12px;opacity:.75}
.cnt{min-width:22px;height:22px;padding:0 6px;border-radius:99px;background:var(--acc);color:#fff;font-size:12px;display:inline-flex;align-items:center;justify-content:center}
.srch{position:relative;margin-bottom:8px}
.srch input{width:100%;min-height:46px;padding:8px 13px 8px 42px;border:1.5px solid var(--bd);border-radius:14px;background:#fff;font-size:16px;outline:none}
.srch svg{position:absolute;left:13px;top:13px;color:var(--mu);width:20px;height:20px}
.srch input:focus{border-color:var(--pri2)}
/* nav: mobile tabs + desktop sidebar */
#tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--bd);display:flex;padding-bottom:var(--sab);z-index:30;box-shadow:0 -4px 16px rgba(20,30,90,.06)}
#tabs a{flex:1;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;color:var(--mu);text-decoration:none;position:relative;padding:6px 2px}
#tabs a.on{color:var(--pri)}
#tabs a svg{width:23px;height:23px}
.nbd{min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--acc);color:#fff;font-size:11px;display:inline-flex;align-items:center;justify-content:center;line-height:1}
#tabs .nbd{position:absolute;top:5px;left:50%;margin-left:6px}
#side{display:none}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:var(--pri2);color:#fff;overflow:hidden;flex:none;width:44px;height:44px;font-size:17px}
.av img{width:100%;height:100%;object-fit:cover}
.av.lg{width:92px;height:92px;font-size:34px}
.hero{background:linear-gradient(135deg,#1d2fe0,#2a5fd6);color:#fff;padding:18px 16px 56px;border-radius:0 0 26px 26px}
.hero h1{font-size:21px}
.hero .av{background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.55)}
.pull{margin-top:-40px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:13px 14px;min-height:92px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;width:100%;color:inherit;text-decoration:none}
a.stat:active,button.stat:active{background:#fafbff}
.stat .v{font-size:28px;line-height:1.1;color:var(--tx)}
html[lang=en] .stat .v{font-weight:700}
.stat .k{font-size:13px;color:var(--mu)}
.stat.pri .v{color:var(--pri)}
.stat.org .v{color:var(--acc)}
.stat.grn .v{color:var(--ok)}
.stat.red .v{color:var(--bad)}
.strip{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:var(--r);background:var(--warnbg);border:1.5px solid #ffd2a8;color:#8a3d00;text-align:left;width:100%;min-height:60px}
.strip .ic{width:40px;height:40px;border-radius:12px;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.oc{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:13px 14px;display:block;width:100%;text-align:left;color:inherit;text-decoration:none}
.oc:active{background:#fafbff}
.oc .id{font-size:15px;letter-spacing:.2px}
.oc .ln{display:flex;gap:8px;align-items:flex-start;margin-top:7px;font-size:14px}
.oc .ln svg{margin-top:2px;color:var(--mu);width:18px;height:18px}
.oc .ft{display:flex;align-items:center;gap:8px;margin-top:11px;padding-top:10px;border-top:1px dashed var(--bd);flex-wrap:wrap}
.empty{text-align:center;padding:42px 24px;color:var(--mu)}
.empty svg{width:54px;height:54px;color:#b9c1dc;stroke-width:1.5;margin:0 auto 10px;display:block}
.empty h3{font-size:17px;color:var(--tx);margin-bottom:4px}
.err-box{text-align:center;padding:30px 20px}
.err-box svg{width:46px;height:46px;color:var(--bad);margin:0 auto 8px;display:block}
.kv{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid #eef1f8;align-items:flex-start}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--mu);font-size:13.5px;width:116px;flex:none}
.kv .v{flex:1;min-width:0;word-break:break-word}
.items .it{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid #eef1f8;align-items:flex-start}
.items .it:last-child{border-bottom:0}
.items .q{background:var(--infobg);color:#1b2a9c;border-radius:8px;min-width:34px;height:28px;display:flex;align-items:center;justify-content:center;font-size:13px;flex:none}
.sum{display:flex;justify-content:space-between;padding:4px 0}
.sum.t{border-top:1.5px solid var(--bd);margin-top:6px;padding-top:9px;font-size:17px}
html[lang=en] .sum.t{font-weight:700}
.stp{list-style:none;margin:0;padding:0}
.stp li{display:flex;gap:12px;align-items:center;position:relative;padding:6px 0;min-height:40px;color:var(--mu)}
.stp li::before{content:"";position:absolute;left:11px;top:-14px;bottom:50%;width:2px;background:#d7dcec}
.stp li:first-child::before{display:none}
.stp li.dn::before,.stp li.cu::before{background:var(--ok)}
.stp .dot{width:24px;height:24px;border-radius:50%;background:#e1e5f2;flex:none;display:flex;align-items:center;justify-content:center;position:relative;z-index:1;color:#fff}
.stp .dot svg{width:14px;height:14px;stroke-width:3}
.stp li.dn{color:var(--tx)}
.stp li.dn .dot{background:var(--ok)}
.stp li.cu{color:var(--pri);font-size:16px}
.stp li.cu .dot{background:var(--pri);box-shadow:0 0 0 5px rgba(29,47,224,.15)}
.stp li.bd{color:var(--bad)}
.stp li.bd .dot{background:var(--bad)}
/* products */
.pc{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:12px;display:flex;flex-direction:column;gap:10px}
.pc .top{display:flex;gap:12px;align-items:flex-start;color:inherit;text-decoration:none;text-align:left;width:100%}
.pc .im{width:76px;height:76px;border-radius:12px;background:var(--bg);overflow:hidden;flex:none;display:flex;align-items:center;justify-content:center;color:#b9c1dc}
.pc .im img{width:100%;height:100%;object-fit:cover}
.pc .im svg{width:32px;height:32px}
.pc .nm{font-size:15.5px}
.pc .pr{font-size:16px;color:var(--pri)}
html[lang=en] .pc .pr{font-weight:700}
.pc .old{color:var(--mu);text-decoration:line-through;font-size:13px;margin-left:6px}
.pc .acts{display:flex;gap:8px;flex-wrap:wrap;padding-top:8px;border-top:1px dashed var(--bd)}
.pc .acts .btn{min-height:40px;font-size:14px;padding:6px 12px;width:auto;flex:1;min-width:84px}
.stk{display:inline-flex;align-items:center;gap:5px;font-size:13.5px}
.stk.low{color:var(--warn)}
.stk.out{color:var(--bad)}
.ph{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;margin-bottom:6px}
.ph .it{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--bg);border:2px solid var(--bd)}
.ph .it.main{border-color:var(--ok)}
.ph .it img{width:100%;height:100%;object-fit:cover;display:block}
.ph .it .x{position:absolute;top:4px;right:4px;width:30px;height:30px;border-radius:50%;background:rgba(21,26,45,.75);color:#fff;display:flex;align-items:center;justify-content:center}
.ph .it .x svg{width:16px;height:16px}
.ph .it .mk{position:absolute;left:4px;bottom:4px;font-size:11px;background:var(--ok);color:#fff;border-radius:99px;padding:1px 8px}
.ph .it .mkb{position:absolute;left:4px;bottom:4px;font-size:11px;background:rgba(21,26,45,.75);color:#fff;border-radius:99px;padding:2px 8px;min-height:24px}
.ph .it .ul{position:absolute;inset:0;background:rgba(255,255,255,.8);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px}
.ph .add{aspect-ratio:1;border:2px dashed #b9c1dc;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--mu);font-size:13px;background:#fff;text-align:center}
.ph .add svg{width:26px;height:26px}
.cmp{display:grid;grid-template-columns:auto 1fr 1fr;gap:4px 12px;font-size:14px}
.cmp .hd{color:var(--mu);font-size:12.5px}
.stepper{display:flex;align-items:center;gap:10px;justify-content:center;margin:12px 0}
.stepper button{width:52px;height:52px;border-radius:14px;border:1.5px solid var(--bd);font-size:26px;background:#fff;line-height:1}
.stepper input{width:110px;min-height:52px;text-align:center;font-size:24px;border:1.5px solid var(--bd);border-radius:14px;outline:none}
#sheet{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end;justify-content:center}
.sbk{position:absolute;inset:0;background:rgba(15,20,50,.55);animation:fade .2s}
.sh{position:relative;width:100%;max-width:520px;max-height:92vh;overflow:auto;background:#fff;border-radius:22px 22px 0 0;padding:8px 16px calc(18px + var(--sab));animation:up .25s ease-out;overscroll-behavior:contain}
.sgrab{width:44px;height:5px;border-radius:9px;background:#d5daea;margin:4px auto 12px}
.sh h2{font-size:19px;margin-bottom:6px}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
body.nosc{overflow:hidden}
.rad{display:flex;align-items:center;gap:12px;min-height:50px;padding:8px 12px;border:1.5px solid var(--bd);border-radius:12px;margin-bottom:8px;cursor:pointer}
.rad input{width:20px;height:20px;accent-color:var(--pri);flex:none}
.rad.on{border-color:var(--pri);background:#f4f6ff}
#toasts{position:fixed;left:0;right:0;top:calc(10px + var(--sat));z-index:300;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 12px}
.toast{max-width:456px;width:100%;background:#151a2d;color:#fff;border-radius:14px;padding:12px 15px;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.3);animation:tin .25s;display:flex;gap:10px;align-items:center;pointer-events:auto}
.toast.ok{background:#0b7a3b}
.toast.bad{background:#b3222e}
.toast.new{background:var(--acc)}
.toast svg{width:20px;height:20px}
@keyframes tin{from{transform:translateY(-14px);opacity:0}}
.auth{padding:calc(26px + var(--sat)) 18px 24px;max-width:540px;margin:0 auto}
.topr{display:flex;justify-content:flex-end}
.logo{display:flex;align-items:center;gap:12px;justify-content:center;margin:8px 0 6px}
.logo .mk{width:54px;height:54px;border-radius:16px;background:linear-gradient(135deg,#1d2fe0,#2a5fd6);display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 6px 18px rgba(29,47,224,.35)}
.logo .mk svg{width:30px;height:30px}
.logo .blg{height:46px;width:auto;max-width:180px;object-fit:contain}
.logo .nm{font-size:25px;color:var(--pri);line-height:1.1}
.logo .nm small{display:block;font-size:13px;color:var(--acc);letter-spacing:2.5px;text-transform:uppercase}
.langb{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:6px 14px;border-radius:99px;background:#fff;border:1.5px solid var(--bd);font-size:14px;color:var(--tx)}
.langb svg{width:18px;height:18px}
.prog{display:flex;align-items:center;margin:4px 0 16px}
.prog .st{display:flex;flex-direction:column;align-items:center;gap:4px;flex:none;width:84px;font-size:12.5px;color:var(--mu);text-align:center}
.prog .nb{width:34px;height:34px;border-radius:50%;background:#dde2f1;color:var(--mu);display:flex;align-items:center;justify-content:center;font-size:15px}
.prog .st.on .nb{background:var(--pri);color:#fff;box-shadow:0 0 0 5px rgba(29,47,224,.15)}
.prog .st.dn .nb{background:var(--ok);color:#fff}
.prog .st.on,.prog .st.dn{color:var(--tx)}
.prog .ln{flex:1;height:3px;background:#dde2f1;margin:0 -6px 18px;border-radius:3px}
.prog .ln.dn{background:var(--ok)}
.up{display:flex;align-items:center;gap:12px;padding:10px;border:1.5px dashed #b9c1dc;border-radius:14px;background:#fff;min-height:72px;cursor:pointer;margin-bottom:10px;position:relative}
.up.has{border-style:solid;border-color:var(--ok);background:#f3fbf6}
.up.err{border-color:var(--bad)}
.up input{position:absolute;opacity:0;width:1px;height:1px}
.up.has>svg:last-child{color:var(--ok)}
.up .th{width:52px;height:52px;border-radius:10px;background:var(--bg);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--mu);flex:none}
.up .th img{width:100%;height:100%;object-fit:cover}
.up .th svg{width:24px;height:24px}
.ups{list-style:none;margin:0;padding:0}
.ups li{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #eef1f8}
.ups li:last-child{border-bottom:0}
.pb{height:6px;border-radius:6px;background:#e3e8f6;overflow:hidden;margin-top:5px}
.pb i{display:block;height:100%;background:var(--pri2);width:0;transition:width .15s}
.hero2{text-align:center;padding:26px 16px 8px;max-width:540px;margin:0 auto}
.hero2 .ci{width:86px;height:86px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;background:var(--warnbg);color:var(--acc)}
.hero2 .ci svg{width:42px;height:42px}
.hero2.bad .ci{background:var(--badbg);color:var(--bad)}
.hero2 h1{font-size:23px;margin-bottom:4px}
.rsn{background:var(--badbg);border:1.5px solid #f2b8bd;border-radius:14px;padding:13px 14px;color:#8f1823;margin:6px 0}

function api(method, path, body, o) {

    if (S.tok && !o.anon) h['Authorization'] = 'Bearer ' + S.tok;

    if (ctl) init.signal = ctl.signal;

    fetch(API + path, init).then(function (r) {
      return r.text().then(function (t) {
        clearTimeout(to);
        var j = null; try { j = t ? JSON.parse(t) : {}; } catch (e) { j = null; }

function upload(kind, file, onp) {
  return new Promise(function (res, rej) {
    var x = new XMLHttpRequest();

    x.timeout = 120000;
    x.upload.onprogress = function (e) { if (e.lengthComputable && onp) onp(e.loaded / e.total); };
    x.onload = function () {
      var j = null; try { j = JSON.parse(x.responseText); } catch (e) {}
      if (x.status >= 200 && x.status < 300 && j) return res(j);

function fieldMsg(e) {

  if (e.status === 413 || e.status === 415) return errMsg(e);
  if (e.status === 400 && e.field === 'v' && e.error && /approved only/.test(e.error)) return e.error;
  if (e.status === 400 && e.field === 'imgs' && e.error && /uploaded properly/.test(e.error)) return e.error;

function loadImg(file) { if (window.createImageBitmap) return createImageBitmap(file).catch(function () { return viaImg(file); }); return viaImg(file); }

}

  var MAXB = (docKind ? 4 : 3) * 1024 * 1024;

    var isPdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name || '');

    if (isPdf) { if (!docKind) return rej('type'); if (file.size > MAXB) return rej('big'); return res(file); }
    loadImg(file).then(function (img) {
      var w = img.width, h = img.height, m = Math.max(w, h), s = m > 1600 ? 1600 / m : 1;
      var small = s === 1 && file.size < 1.5 * 1048576 && /^image\/(jpeg|png|webp)$/.test(file.type);
      if (small) { if (img.close) img.close(); return res(file); }

      var x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
      if (img.close) img.close();

}

function prepCover(file) {
  var MAXB = 3 * 1024 * 1024;
  return loadImg(file).then(function (img) {
    var w = img.width, h = img.height, s = w > 2000 ? 2000 / w : 1;
    var c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w * s)); c.height = Math.max(1, Math.round(h * s));
    var x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height); if (img.close) img.close();
    return new Promise(function (res, rej) {
      var q = 0.86;
      (function go() { c.toBlob(function (b) { if (!b) return rej('unsupported'); if (b.size > MAXB - 2048 && q > 0.4) { q -= 0.12; return go(); } if (b.size > MAXB) return rej('big'); res(new File([b], 'cover.jpg', { type: 'image/jpeg' })); }, 'image/jpeg', q); })();
    });
  }, function () { return Promise.reject('unsupported'); });
}

var LFP = null;
function leaflet() {

      var s = document.createElement('script'); s.src = srcs[i][1]; s.async = true;

      s.onerror = function () { if (c.parentNode) c.parentNode.removeChild(c); tryAt(i + 1); };
      document.head.appendChild(s);

}

  var k = inp.getAttribute('data-kind') || '';
  return { preset: k === 'logo' ? 'logo' : k === 'cover' ? 'cover' : k === 'photo' ? 'profile' : /^(nid_front|nid_back|license)$/.test(k) ? 'doc' : 'product', lang: S.lang };
});

/* =====================================================================
 * ORDERS
 * ===================================================================== */
var OFIL = ['new', 'confirmed', 'packed', 'shipped', 'delivered', 'cancelled', 'rejected', 'all'];
function scrOrders(silent) {
  var v = S.rv;
  if (!silent) {
    $('#view').innerHTML = bar(L('Orders', 'অর্ডার')) + '<div class="pg"><div id="ofil"></div><div id="olist"><div class="spin"></div></div></div>';
    if (S.ocache) drawOrders();
  }
  api('GET', '/seller/orders').then(function (d) {
    if (v !== S.rv) return; var k = JSON.stringify(d);
    if (silent && S.lastJson.ol === k) return; S.lastJson.ol = k; S.ocache = d; drawOrders();
  }, function (e) { if (v !== S.rv || e.handled || silent) return; var ol = $('#olist'); if (ol && !S.ocache) ol.innerHTML = errBox(e, 'retryord'); });
}
ACT.retryord = function () { scrOrders(false); };
function drawOrders() {
  var d = S.ocache; if (!d) return; var ol = $('#olist'); if (!ol) return;
  var c = d.counts;
  $('#ofil').innerHTML = '<div class="filters">' + OFIL.map(function (k) { var lab = k === 'all' ? L('All', 'সব') : L(OS[k][0], OS[k][1]); return '<button class="fc ' + (S.of === k ? 'on' : '') + '" data-act="ofilt" data-f="' + k + '">' + esc(lab) + ' <span class="c2">' + n(c[k] || 0) + '</span></button>'; }).join('') + '</div>';
  var rows = d.orders.filter(function (o) { return S.of === 'all' || o.st === S.of; });
  ol.innerHTML = rows.length ? '<div class="grid">' + rows.map(ocard).join('') + '</div>' : '<div class="empty">' + ic('list') + '<h3 class="h">' + L('No orders here', 'এখানে কোনো অর্ডার নেই') + '</h3><p>' + L('Orders for your products will appear here.', 'আপনার প্রোডাক্টের অর্ডার এখানে দেখাবে।') + '</p></div>';
}
ACT.ofilt = function (b) { S.of = b.getAttribute('data-f'); drawOrders(); };
function scrOrder(id, silent) {
  var v = S.rv;
  if (!silent) $('#view').innerHTML = bar(L('Order', 'অর্ডার') + ' #' + id, true, '', '/orders') + '<div class="pg nar" id="od"><div class="spin"></div></div>';
  api('GET', '/seller/orders/' + encodeURIComponent(id)).then(function (d) {
    if (v !== S.rv) return; var k = JSON.stringify(d.order);
    if (silent && S.lastJson.od === k) return; if (silent && S.sheetOpen) return; S.lastJson.od = k; drawOrder(d.order);
  }, function (e) { if (v !== S.rv || e.handled || silent) return; var el = $('#od'); if (el) el.innerHTML = errBox(e, 'retryodr'); });
}
ACT.retryodr = function () { scrOrder(S.route.arg, false); };
function kv(k, v, raw) { return '<div class="kv"><div class="k">' + esc(k) + '</div><div class="v">' + (raw ? v : esc(v)) + '</div></div>'; }
function drawOrder(o) {
  var el = $('#od'); if (!el) return;
  var flow = ['new', 'confirmed', 'packed', 'shipped', 'delivered'], cur = flow.indexOf(o.st), bad = o.st === 'cancelled' || o.st === 'rejected';
  var fl = { new: [L('Order received', 'অর্ডার এসেছে')], confirmed: [L('Confirmed by you', 'আপনি কনফার্ম করেছেন')], packed: [L('Packed', 'প্যাক করা হয়েছে')], shipped: [L('Out for delivery', 'ডেলিভারিতে')], delivered: [L('Delivered', 'ডেলিভারি হয়েছে')] };
  var steps = '';
  if (bad) {
    steps = '<li class="dn"><span class="dot">' + ic('check') + '</span>' + esc(fl.new[0]) + '</li><li class="bd cu"><span class="dot">' + ic('x') + '</span>' + esc(L(OS[o.st][0], OS[o.st][1])) + '</li>';
  } else steps = flow.map(function (k, i) { return '<li class="' + (i < cur ? 'dn' : i === cur ? 'cu' : '') + '"><span class="dot">' + (i <= cur ? ic('check') : '') + '</span>' + esc(fl[k][0]) + '</li>'; }).join('');
  var its = o.items.map(function (i) { return '<div class="it"><span class="q">' + n(i.q) + 'x</span><div class="sp">' + esc(S.lang === 'bn' && i.bn ? i.bn : i.n) + (i.variant ? '<div class="mu sm vlb">' + esc(i.variant) + '</div>' : '') + '<div class="mu sm">' + money(i.unit) + ' ' + L('each', 'প্রতি') + '</div></div><b class="b6">' + money(i.q * i.unit) + '</b></div>'; }).join('');
  var acts = '';
  if (o.st === 'new') acts = '<button class="btn ok" data-act="oact" data-a="confirm">' + ic('check') + L('Confirm order', 'অর্ডার কনফার্ম করুন') + '</button><button class="btn sec" data-act="oact" data-a="pack">' + ic('box') + L('Confirm and mark packed', 'কনফার্ম করে প্যাক করা হয়েছে জানান') + '</button><button class="btn dng" data-act="orej">' + ic('x') + L('Reject (cannot fulfil)', 'বাতিল করুন (দিতে পারছি না)') + '</button>';
  else if (o.st === 'confirmed') acts = '<button class="btn ok" data-act="oact" data-a="pack">' + ic('box') + L('Mark as packed', 'প্যাক করা হয়েছে জানান') + '</button><button class="btn dng" data-act="orej">' + ic('x') + L('Reject (cannot fulfil)', 'বাতিল করুন (দিতে পারছি না)') + '</button>';
  el.innerHTML = '<div class="gap"><div class="card"><div class="row"><h2 class="h sp" style="margin:0">#' + esc(o.id) + '</h2>' + ochip(o.st) + '</div>' +
    kv(L('Ordered', 'অর্ডারের সময়'), fmtDT(o.created_at * 1000)) + kv(L('Sold via', 'বিক্রি হয়েছে'), viewLabel(o.view)) + kv(L('Customer', 'ক্রেতা'), o.cu || '-') +
    (o.st === 'rejected' && o.note ? kv(L('Your reason', 'আপনার কারণ'), o.note) : '') + '</div>' +
    (o.other ? '<div class="banner">' + ic('info') + '<div class="sp">' + L('This order also has items from other shops. You only see and handle your own items.', 'এই অর্ডারে অন্য দোকানের পণ্যও আছে। আপনি শুধু নিজের পণ্য দেখবেন ও সামলাবেন।') + '</div></div>' : '') +
    (acts ? '<div class="card"><h2 class="h">' + L('Action', 'কাজ') + '</h2><div class="btns">' + acts + '</div></div>' : '') +
    '<div class="card items"><h2 class="h">' + L('Your items', 'আপনার পণ্য') + '</h2>' + its + '<div class="sum t"><span>' + L('Your total', 'আপনার মোট') + '</span><b>' + money(o.sub) + '</b></div></div>' +
    '<div class="card"><h2 class="h">' + L('Progress', 'অগ্রগতি') + '</h2><ul class="stp">' + steps + '</ul></div></div>';
}
ACT.oact = function (b) {
  var a = b.getAttribute('data-a'); busy(b, true);
  api('POST', '/seller/orders/' + encodeURIComponent(S.route.arg) + '/action', { action: a }).then(function (d) {
    toast(a === 'confirm' ? L('Order confirmed', 'অর্ডার কনফার্ম হয়েছে') : L('Marked as packed', 'প্যাক করা হয়েছে'), 'ok'); afterOrder();
  }, function (e) { busy(b, false); if (e.handled) return; toast(errMsg(e), 'bad'); if (e.code === 'bad_state' || e.code === 'order_closed') afterOrder(); });
};
function afterOrder() { S.lastJson.od = ''; S.lastJson.ol = ''; S.ocache = null; loadDash().catch(function () {}); scrOrder(S.route.arg, true); }
ACT.orej = function () {
  openSheet('<h2 class="h">' + L('Reject this order?', 'অর্ডারটি বাতিল করবেন?') + '</h2><p class="mu" style="margin-bottom:10px">' + L('Use this only if you cannot supply the items. NurBuy will be notified.', 'পণ্য দিতে না পারলেই কেবল এটি করুন। NurBuy কে জানানো হবে।') + '</p><form data-form="orej" novalidate>' +
    fld({ name: 'reason', label: L('Reason', 'কারণ'), req: 1, area: 1, max: 200, ph: L('e.g. Out of stock', 'যেমন: স্টক শেষ') }) +
    '<div class="btns"><button class="btn red" type="submit">' + L('Reject order', 'অর্ডার বাতিল করুন') + '</button><button class="btn gh" type="button" data-act="sclose">' + L('Back', 'ফিরে যান') + '</button></div></form>');
};
FORM.orej = function (f) {
  var v = vals(f); clearErrs(f);
  if (!v.reason.trim()) { setErr(f, 'reason', L(FMSG.reason[0], FMSG.reason[1]), true); return; }
  if (!guardForm(f)) return;
  var b = $('button[type=submit]', f); busy(b, true);
  api('POST', '/seller/orders/' + encodeURIComponent(S.route.arg) + '/action', { action: 'reject', reason: v.reason.trim() }).then(function () { closeSheet(); toast(L('Order rejected', 'অর্ডার বাতিল করা হয়েছে'), 'ok'); afterOrder(); },
    function (e) { unguard(f); busy(b, false); if (e.handled) return; toast(errMsg(e), 'bad'); if (e.code === 'bad_state' || e.code === 'order_closed') { closeSheet(); afterOrder(); } });
};

/* =====================================================================
 * NOTIFICATIONS
 * ===================================================================== */
function scrNotifs() {
  var v = S.rv;
  $('#view').innerHTML = bar(L('Notifications', 'নোটিফিকেশন')) + '<div id="nl" class="pg nar gap"><div class="spin"></div></div>';
  api('GET', '/seller/notifications').then(function (d) {
    if (v !== S.rv) return; var nl = $('#nl'); if (!nl) return; var ns = d.notifications;
    nl.innerHTML = !ns.length ? '<div class="empty">' + ic('bell') + '<h3 class="h">' + L('No notifications yet', 'এখনো কোনো নোটিফিকেশন নেই') + '</h3><p>' + L('New orders and messages from NurBuy will show up here.', 'নতুন অর্ডার ও NurBuy-এর বার্তা এখানে দেখাবে।') + '</p></div>' : msgCards(ns);
    if (d.unread > 0) api('POST', '/seller/notifications/read').then(function () { S.unread = 0; updBadges(); }, function () {});
  }, function (e) { if (v !== S.rv || e.handled) return; var nl = $('#nl'); if (nl) nl.innerHTML = errBox(e, 'retrynot'); });
}
ACT.retrynot = function () { scrNotifs(); };

/* =====================================================================
 * PROFILE
 * ===================================================================== */
var CHGL = { mobile: ['Mobile', 'মোবাইল'], email: ['Email', 'ইমেইল'] };
function scrProfile() {
  var v = S.rv;
  var draw = function () {
    var r = S.seller, chg = r.chg;
    var h = bar(L('Profile', 'প্রোফাইল')) + '<div class="pg nar gap">' + coverHtml(r) + '<div class="card tc">' +
      '<h2 class="h" style="font-size:20px;margin:0 0 4px">' + esc(r.shop_name) + '</h2><span class="chip g">' + L('Approved seller', 'অনুমোদিত সেলার') + '</span> <span class="chip n">' + esc(viewLabel(r.sell_view)) + '</span></div>' +
      '<div class="card mnu hide-d"><a href="#/notifications">' + ic('bell') + '<span class="sp">' + L('Notifications', 'নোটিফিকেশন') + '</span>' + (S.unread ? '<span class="nbd">' + n(S.unread) + '</span>' : '') + ic('chev') + '</a><a href="#/txns">' + ic('receipt') + '<span class="sp">' + L('Transactions & invoices', 'লেনদেন ও ইনভয়েস') + '</span>' + ic('chev') + '</a><a href="#/coupons">' + ic('tag') + '<span class="sp">' + L('Coupons', 'কুপন') + '</span>' + ic('chev') + '</a></div>' +
      '<div class="card mnu"><a href="#/shop">' + ic('pin') + '<span class="sp">' + L('Opening hours & map location', 'খোলার সময় ও ম্যাপ লোকেশন') + '<br><span class="mu sm">' + (r.hours ? (r.open_now ? L('Open now', 'এখন খোলা') : L('Closed now', 'এখন বন্ধ')) : L('Always open', 'সবসময় খোলা')) + ' · ' + (r.lat != null ? L('Location set', 'লোকেশন দেওয়া আছে') : L('Location not set', 'লোকেশন দেওয়া হয়নি')) + '</span></span>' + ic('chev') + '</a></div>';
    if (chg) h += '<div class="banner warn">' + ic('clock') + '<div class="sp"><b class="b6">' + L('Changes waiting for admin approval', 'অ্যাডমিনের অনুমোদনের অপেক্ষায় থাকা পরিবর্তন') + '</b><br>' + Object.keys(chg).map(function (k) { return esc(CHGL[k] ? L(CHGL[k][0], CHGL[k][1]) : k) + ': <b class="b6">' + esc(k === 'mobile' ? n(chg[k]) : (chg[k] || '-')) + '</b>'; }).join('<br>') + '</div></div>';
    h += '<div class="card"><div class="row" style="margin-bottom:6px"><h2 class="h sp" style="margin:0">' + L('Shop details', 'দোকানের তথ্য') + '</h2><button class="btn sec sm2" data-act="editprof">' + ic('edit') + L('Edit', 'সম্পাদনা') + '</button></div>' +
      kv(L('Shop', 'দোকান'), r.shop_name) + kv(L('Owner', 'মালিক'), r.owner_name) + kv(L('Mobile', 'মোবাইল'), n(r.mobile)) + kv(L('Email', 'ইমেইল'), r.email || '-') + kv(L('Address', 'ঠিকানা'), r.address) +
      kv(L('Category', 'ক্যাটাগরি'), r.category || '-') + (r.about ? kv(L('About', 'সম্পর্কে'), r.about) : '') + kv(L('NID', 'এনআইডি'), '<span dir="ltr">' + esc(n(maskNid(r.nid))) + '</span>', 1) + (r.trade_no ? kv(L('Trade license', 'ট্রেড লাইসেন্স'), r.trade_no) : '') +
      '<p class="hint">' + L('Shop name, selling type and NID cannot be changed here. Mobile and email changes need admin approval. Contact NurBuy for other changes.', 'দোকানের নাম, বিক্রির ধরন ও এনআইডি এখান থেকে বদলানো যাবে না। মোবাইল ও ইমেইল বদলাতে অ্যাডমিনের অনুমোদন লাগবে। অন্য পরিবর্তনের জন্য NurBuy-এর সাথে যোগাযোগ করুন।') + '</p></div>' +
      '<div class="card"><h2 class="h">' + L('Documents', 'ডকুমেন্ট') + '</h2>' + docRows(r, false) + '</div>' +
      '<div class="card"><h2 class="h">' + L('Settings', 'সেটিংস') + '</h2><div class="btns"><button class="btn sec" data-act="chpw">' + ic('lock') + L('Change password', 'পাসওয়ার্ড বদলান') + '</button><button class="btn sec" data-act="lang">' + ic('globe') + (S.lang === 'bn' ? 'Switch to English' : 'বাংলায় দেখুন') + '</button><button class="btn dng" data-act="logout">' + ic('logout') + L('Log out', 'লগআউট') + '</button></div></div></div>';
    $('#view').innerHTML = h;
  };
  draw();
  api('GET', '/seller/me').then(function (d) {
    if (v !== S.rv) return; var k = JSON.stringify(d.seller), old = JSON.stringify(S.seller); S.seller = d.seller;
    if (S.seller.status !== 'approved') return render(); if (k !== old && !S.sheetOpen) draw();
  }, function () {});
}
function maskNid(s) { s = String(s || ''); return s.length <= 3 ? s : new Array(s.length - 2).join('*') + s.slice(-3); }
ACT.chlogo = function () {
  pickFile('logo', function (file) {
    toast(L('Uploading logo...', 'লোগো আপলোড হচ্ছে...'));
    sendFile('logo', file).then(function (d) { S.seller = d.seller; toast(L('Logo updated', 'লোগো বদলানো হয়েছে'), 'ok'); render(); }, function (e) { toast(e && e.prep ? prepMsg(e.prep) : (fieldMsg(e) || errMsg(e)), 'bad'); });
  });
};
ACT.chpw = function () {
  openSheet('<h2 class="h">' + L('Change password', 'পাসওয়ার্ড বদলান') + '</h2><form data-form="pw" novalidate>' +
    fld({ name: 'current', label: L('Current password', 'বর্তমান পাসওয়ার্ড'), type: 'password', ac: 'current-password' }) + fld({ name: 'password', label: L('New password (min 8 characters)', 'নতুন পাসওয়ার্ড (কমপক্ষে ৮ অক্ষর)'), type: 'password', ac: 'new-password' }) +
    fld({ name: 'password2', label: L('Confirm new password', 'নতুন পাসওয়ার্ড আবার দিন'), type: 'password', ac: 'new-password' }) +
    '<div class="btns"><button class="btn" type="submit">' + L('Update password', 'পাসওয়ার্ড আপডেট করুন') + '</button><button class="btn gh" type="button" data-act="sclose">' + L('Cancel', 'বাতিল') + '</button></div></form>');
};
FORM.pw = function (f) {
  var v = vals(f); clearErrs(f); var bad = false;
  if (!v.current) { setErr(f, 'current', L('Enter your current password', 'বর্তমান পাসওয়ার্ড দিন')); bad = true; }
  if (v.password.length < 8) { setErr(f, 'password', L(FMSG.password[0], FMSG.password[1])); bad = true; }
  else if (v.password !== v.password2) { setErr(f, 'password2', L('Passwords do not match', 'পাসওয়ার্ড মিলছে না')); bad = true; }
  if (bad || !guardForm(f)) return;
  var b = $('button[type=submit]', f); busy(b, true);
  api('POST', '/seller/password', { current: v.current, password: v.password }).then(function () { closeSheet(); toast(L('Password changed', 'পাসওয়ার্ড বদলানো হয়েছে'), 'ok'); },
    function (e) { unguard(f); busy(b, false); if (e.handled) return; if (e.field && setErr(f, e.field, fieldMsg(e), true)) return; toast(errMsg(e), 'bad'); });
};

document.addEventListener('change', function (e) { var t = e.target; if (t && t.type === 'radio') { $$('input[type=radio][name="' + t.name + '"]', t.closest('form') || document).forEach(function (r) { var l = r.closest('.rad'); if (l) l.classList.toggle('on', r.checked); }); } });

/* =====================================================================
 * POLLING + INIT
 * ===================================================================== */
function pollTick() {
  if (document.hidden || !S.tok || !S.seller || S.applying) return;
  if (S.seller.status === 'approved') {
    loadDash().then(function () {
      if (S.sheetOpen) return; var r = S.route.name;
      if (r === 'home') { var k = JSON.stringify(S.dash); if (S.lastJson.dash !== k) { S.lastJson.dash = k; drawHome(S.dash); } }
      else if (r === 'orders') scrOrders(true);
      else if (r === 'order') scrOrder(S.route.arg, true);
    }, function () {});
  } else refreshMe().catch(function () {});
}
setInterval(pollTick, 20000);
document.addEventListener('visibilitychange', function () { if (!document.hidden) pollTick(); });

(function init() {
  var l = lsGet('nbs_lang'); if (l === 'en' || l === 'bn') S.lang = l; document.documentElement.lang = S.lang;
  var t = lsGet('nbs_tok'); if (t) S.tok = t;
  if (!API) { $('#view').innerHTML = '<div class="err-box">' + ic('alert') + '<p>config.js missing (NB_API)</p></div>'; return; }
  if (!location.hash) { try { history.replaceState(null, '', '#/' + (S.tok ? 'home' : 'login')); } catch (e) {} }
  render();
  loadBrand();
})();
})();
</script>
</body>
</html>
